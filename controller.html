<script src="resources/@sammachin/node-red-matter-controller/editor.js"></script>

<script type="text/javascript">
    // Officially assigned ISO 3166-1 alpha-2 country codes, plus "XX"
    // (the user-assigned code Matter uses to mean "no specific country").
    var MATTER_COUNTRY_CODES = new Set([
        "XX",
        "AD","AE","AF","AG","AI","AL","AM","AO","AQ","AR","AS","AT","AU","AW","AX","AZ",
        "BA","BB","BD","BE","BF","BG","BH","BI","BJ","BL","BM","BN","BO","BQ","BR","BS","BT","BV","BW","BY","BZ",
        "CA","CC","CD","CF","CG","CH","CI","CK","CL","CM","CN","CO","CR","CU","CV","CW","CX","CY","CZ",
        "DE","DJ","DK","DM","DO","DZ",
        "EC","EE","EG","EH","ER","ES","ET",
        "FI","FJ","FK","FM","FO","FR",
        "GA","GB","GD","GE","GF","GG","GH","GI","GL","GM","GN","GP","GQ","GR","GS","GT","GU","GW","GY",
        "HK","HM","HN","HR","HT","HU",
        "ID","IE","IL","IM","IN","IO","IQ","IR","IS","IT",
        "JE","JM","JO","JP",
        "KE","KG","KH","KI","KM","KN","KP","KR","KW","KY","KZ",
        "LA","LB","LC","LI","LK","LR","LS","LT","LU","LV","LY",
        "MA","MC","MD","ME","MF","MG","MH","MK","ML","MM","MN","MO","MP","MQ","MR","MS","MT","MU","MV","MW","MX","MY","MZ",
        "NA","NC","NE","NF","NG","NI","NL","NO","NP","NR","NU","NZ",
        "OM",
        "PA","PE","PF","PG","PH","PK","PL","PM","PN","PR","PS","PT","PW","PY",
        "QA",
        "RE","RO","RS","RU","RW",
        "SA","SB","SC","SD","SE","SG","SH","SI","SJ","SK","SL","SM","SN","SO","SR","SS","ST","SV","SX","SY","SZ",
        "TC","TD","TF","TG","TH","TJ","TK","TL","TM","TN","TO","TR","TT","TV","TW","TZ",
        "UA","UG","UM","US","UY","UZ",
        "VA","VC","VE","VG","VI","VN","VU",
        "WF","WS",
        "YE","YT",
        "ZA","ZM","ZW"
    ]);

    RED.nodes.registerType('mattercontroller',{
        category: 'config',
        defaults: {
            name: {value:""},
            fabricLabel: {value:""},
            networkInterface : {required: true},
            storageLocation: {required: true},
            threadName: {value: "", required: false},
            tlvs: {value: "", required: false},
            wifiSsid: {value: "", required: false},
            wifiCredentials: {value: "", required: false},
            countryCode: {value: "XX", required: false, validate: function(v) {
                if (v === undefined || v === null || v === "") { return true; }
                return MATTER_COUNTRY_CODES.has(String(v).trim().toUpperCase());
            }},
            logLevel: {value: "ERROR"}
        },
        label: function() {
            return this.name||"Controller";
        },
        oneditprepare: function(){
            var selectedInterface = this.networkInterface
            $.get('_mattercontroller/interfaces', function(r) {
                let interfaces = document.getElementById('node-config-input-networkInterface');
                r.forEach(i => {
                    interfaces.add(new Option(i, i));
                });
                if (typeof selectedInterface !== 'undefined'){
                    interfaces.value = selectedInterface
                }
                
            })
            .error(function(e) {
                console.warn('Matter: Failed to fetch network interfaces:', e.status);
            })
            if (!this.storageLocation){
                $.get('_mattercontroller/homedir', function(r) {
                    let defaultLocation=(`${r}/.matter`)
                    let sLoc = document.getElementById('node-config-input-storageLocation');
                    sLoc.value = defaultLocation
                })
                .error(function(e) {
                    console.warn('Matter: Failed to fetch home directory:', e.status);
                })
            }
        },
        oneditsave: function(){
            var cc = document.getElementById('node-config-input-countryCode');
            if (cc && cc.value) { cc.value = cc.value.trim().toUpperCase(); }
        }
    });
</script>
  


<script type="text/x-red" data-template-name="mattercontroller">
    <div class="form-row">
        <label for="node-config-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-fabricLabel">Fabric Label</label>
        <input type="text" id="node-config-input-fabricLabel" placeholder="My Home">
    </div>
    <div class="form-row">
        <label for="node-config-input-networkInterface">Network interface</label>
        <select type="text" id="node-config-input-networkInterface" style="width:50%;" >
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-threadName">Thread Network Name</label>
        <input type="text" id="node-config-input-threadName" >
    </div>
    <div class="form-row">
        <label for="node-config-input-tlvs">TLVs</label>
        <input type="text" id="node-config-input-tlvs" >
    </div>
    <div class="form-row">
        <label for="node-config-input-wifiSsid">WiFi SSID</label>
        <input type="text" id="node-config-input-wifiSsid" >
    </div>
    <div class="form-row">
        <label for="node-config-input-wifiCredentials">WiFi Password</label>
        <input type="password" id="node-config-input-wifiCredentials" >
    </div>
    <div class="form-row">
        <label for="node-config-input-countryCode">Country Code</label>
        <input type="text" id="node-config-input-countryCode" style="width:50%;" placeholder="e.g. GB" maxlength="2" >
        <div class="form-tips" style="max-width:none;">Two-letter ISO 3166-1 alpha-2 code (e.g. <code>GB</code>, <code>US</code>, <code>DE</code>). Use <code>XX</code> for no specific country.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-storageLocation">Storage Location</label>
        <input type="text" id="node-config-input-storageLocation" style="width:50%;" >
    </div>
    <div class="form-row">
        <label for="node-config-input-logLevel">Log Level</label>
        <select type="text" id="node-config-input-logLevel" style="width:50%;" >
            <option value="DEBUG">Debug</option>
            <option value="INFO">Info</option>
            <option value="WARN">Warn</option>
            <option value="ERROR">Error</option>
            <option value="FATAL">Fatal</option>
        </select>
    </div>
   
</script>

<script type="text/x-red" data-help-name="mattercontroller">
    <p>Matter Controller configuration node</p>
    <h3>Settings</h3>
    <dl class="message-properties">
        <dt>Name</dt>
        <dd>Display name for this controller in the Node-RED editor.</dd>
        <dt>Fabric Label</dt>
        <dd>The name your Matter fabric advertises to devices (e.g. "My Home").
        If left blank, defaults to the controller Name. This is what devices
        see as the controller identity.</dd>
        <dt>Network Interface</dt>
        <dd>The IPv6 network interface to use for mDNS discovery.</dd>
        <dt>Country Code</dt>
        <dd>Regulatory country for the fabric, as a two-letter ISO 3166-1 alpha-2
        code (e.g. <code>GB</code>, <code>US</code>, <code>DE</code>). Leave blank or use
        <code>XX</code> for no specific country. Invalid codes are rejected in the editor.</dd>
        <dt>Storage Location</dt>
        <dd>Path to store Matter commissioning data. Defaults to <code>$HOME/.matter</code>.</dd>
        <dt>Log Level</dt>
        <dd>Verbosity of Matter SDK logging.</dd>
    </dl>
</script>
