
<script type="text/javascript">
    RED.nodes.registerType('mattersubscribe',{
        category: 'Matter',
        color: '#95cc95',
        icon: "font-awesome/fa-eye",
        inputs:0,
        outputs:1,
        defaults: {
            name: {value:""},
            controller: { value: "", type: "mattercontroller", required: true },
            device: {value:"", required:true},
            deviceName: {value:""},
            endpoint: {value:""},
            cluster: {value:"", required:true},
            clusterName: {value:""},
            attr: {value:"", required:true},
            simpleMode: {value: "true"},
            topic: {value:""}
        },
        paletteLabel: "Subscribe",
        label: function() {
            if (this.name) return this.name
            if (isRealValue(this.deviceName) && isRealValue(this.attr))
                return this.deviceName + ' | ' + this.attr
            return "Subscribe"
        },
        oneditprepare: function() {
            restoreSelect('node-input-device', this.device, this.deviceName)
            restoreSelect('node-input-cluster', this.cluster, this.clusterName)
            restoreSelect('node-input-attr', this.attr)
            $('#refresh-devices').on("click", getDevices);
            $('#refresh-clusters').on("click", getClusters);
            $('#refresh-attr').on("click", function() { getAttributes(writable=false); } );

        },
        oneditsave: function() {
            this.deviceName = getSelectedText('node-input-device')
            this.clusterName = getSelectedText('node-input-cluster')
        }
    });
</script>

<script type="text/x-red" data-template-name="mattersubscribe">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-controller">Controller</label>
        <input type="text" id="node-input-controller" style="width:70%;">
    </div>
    <div class="form-row">
        <label for="node-input-simpleMode">Simple Mode</label>
        <input type="checkbox" id="node-input-simpleMode" value="true" >
    </div>
    <div class="form-row">
        <label for="node-input-device">Device</label>
        <select type="text" id="node-input-device" style="width:50%;" >
        </select>
        <a id="refresh-devices" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <!--
        <div class="form-row">
        <label for="node-input-endpoint">Endpoint</label>
        <select type="text" id="node-input-endpoint" style="width:50%;" >
        </select>
    </div>
    -->
    <div class="form-row">
        <label for="node-input-cluster">Cluster</label>
        <select type="text" id="node-input-cluster" style="width:50%;" >
        </select>
        <a id="refresh-clusters" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <div class="form-row">
        <label for="node-input-attr">Attribute</label>
        <select type="text" id="node-input-attr" style="width:50%;" >
        </select>
        <a id="refresh-attr" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <div class="form-row">
        <label for="node-input-topic">Topic</label>
        <input type="text" id="node-input-topic">
    </div>
</script>

<script type="text/x-red" data-help-name="mattersubscribe">
    <p>Subscribe to Attribute changes on a Matter Device</p>
    <h3>Details</h3>
    <p>Subscriptions monitor a specific cluster attribute for value changes. When the
    attribute value changes on the device, the node outputs a message with the new
    value. This is useful for tracking continuous state like temperature, brightness
    level, or on/off status.</p>
    <p>Unlike <b>Event</b> (which listens for discrete one-shot notifications from the
    device), a Subscription watches for any change to the current value of an attribute.</p>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The new attribute value</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>The configured topic string</dd>
    </dl>
</script>
