
<script type="text/javascript">
    RED.nodes.registerType('matterevent',{
        category: 'Matter',
        color: '#95cc95',
        icon: "font-awesome/fa-bell",
        inputs:0,
        outputs:1,
        defaults: {
            name: {value:""},
            controller: { value: "", type: "mattercontroller", required: true },
            device: {value:""},
            deviceName: {value:""},
            endpoint: {value:""},
            cluster: {value:""},
            event: {value:""},
            simpleMode: {value: "true"},
            topic: {value:""}
        },
        paletteLabel: "Event",
        label: function() {
            if (this.name) return this.name
            if (isRealValue(this.deviceName) && isRealValue(this.event))
                return this.deviceName + ' | ' + this.event
            return "Event"
        },
        oneditprepare: function() {
            var _initDone = false
            if (this.device.length != 0){
                setDevice(this.controller, this.device)
            } 
            if (this.cluster.length != 0){
                setCluster(this.controller, this.device, this.cluster)
            }
            if (this.event.length != 0){
                setEvent(this.controller, this.device, this.cluster, this.event);
            } 
            $('#refresh-devices').on("click", getDevices);
            $('#refresh-clusters').on("click", getClusters);
            $('#refresh-event').on("click", getEvents);
            $('#node-input-controller').on("change", function() { if (_initDone) getDevices() });
            $('#node-input-device').on("change", function() { if (_initDone) getClusters() });
            $('#node-input-cluster').on("change", function() { if (_initDone) getEvents() });
            setTimeout(function() { _initDone = true }, 500);

        },
        oneditsave: function() {
            this.deviceName = getSelectedText('node-input-device')
        }
    });
</script>

<script type="text/x-red" data-template-name="matterevent">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-controller">Controller</label>
        <input type="text" id="node-input-controller" style="width:70%;">
    </div>
    <div class="form-row">
        <label for="node-input-simpleMode">Simple Mode</label>
        <input type="checkbox" id="node-input-simpleMode" value="true" >
    </div>
    <div class="form-row">
        <label for="node-input-device">Device</label>
        <select type="text" id="node-input-device" style="width:50%;" >
        </select>
        <a id="refresh-devices" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <!--
        <div class="form-row">
        <label for="node-input-endpoint">Endpoint</label>
        <select type="text" id="node-input-endpoint" style="width:50%;" >
        </select>
    </div>
    -->
    <div class="form-row">
        <label for="node-input-cluster">Cluster</label>
        <select type="text" id="node-input-cluster" style="width:50%;" >
        </select>
        <a id="refresh-clusters" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <div class="form-row">
        <label for="node-input-event">Event</label>
        <select type="text" id="node-input-event" style="width:50%;" >
        </select>
        <a id="refresh-event" class="btn"><i class="fa fa-refresh"></i></a>
    </div>
    <div class="form-row">
        <label for="node-input-topic">Topic</label>
        <input type="text" id="node-input-topic">
    </div>
</script>

<script type="text/x-red" data-help-name="matterevent">
    <p>Receive Events from a Matter Device</p>
    <h3>Details</h3>
    <p>Events are one-shot notifications emitted by a device cluster when something
    discrete happens, such as a button press, a sensor trigger, or a state transition.
    Unlike <b>Subscribe</b> (which monitors continuous attribute changes), an Event fires
    only when the device explicitly reports it.</p>
    <p>Select the device, cluster, and event to listen for. When the event fires, the
    node outputs a message with the event data in <code>msg.payload</code>.</p>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The event data reported by the device</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>The configured topic string</dd>
    </dl>
</script>
